[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
viumic-engine = { path = "crates/engine" }
anyhow = "1"

# Model inference is unusably slow unoptimized; keep deps fast even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
