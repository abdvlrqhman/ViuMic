<!doctype html>
<!--
  README banner. Render (from this folder, after `pnpm install`):
  msedge --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,640
         --screenshot=../banner.png banner.html
  Uses the app screenshot ../app.png.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: Geist;
    src: url(../../../ui/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format(woff2);
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Geist, system-ui, sans-serif;
    color: #fafafa;
    background:
      radial-gradient(620px 420px at 1010px 330px, rgb(79 233 192 / 0.16), transparent 70%),
      radial-gradient(700px 500px at 160px 120px, rgb(35 42 99 / 0.55), transparent 70%),
      linear-gradient(160deg, #0d1030 0%, #09090b 60%);
    position: relative;
  }
  #waves { position: absolute; inset: 0; }
  .copy { position: absolute; left: 84px; top: 92px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 92px; height: 92px; filter: drop-shadow(0 10px 30px rgb(79 233 192 / 0.25)); }
  h1 { font-size: 88px; font-weight: 650; letter-spacing: -0.045em; line-height: 1; }
  .tagline { margin-top: 34px; font-size: 38px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; color: #e4e4e7; }
  .tagline em { font-style: normal; color: #7dfad6; }
  .facts { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .facts span {
    font-size: 19px; color: #d4d4d8; padding: 8px 15px; border-radius: 999px;
    background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.1);
  }
  .spacie { position: absolute; left: 84px; bottom: 56px; display: flex; align-items: center; gap: 10px; font-size: 19px; color: #a1a1aa; }
  .spacie img { width: 24px; height: 24px; }
  .shot {
    position: absolute; left: 846px; top: 64px; width: 372px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.12);
    box-shadow: 0 40px 90px rgb(0 0 0 / 0.6), 0 0 0 8px rgb(255 255 255 / 0.025);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <svg id="waves" width="1280" height="640" viewBox="0 0 1280 640"></svg>
  <div class="copy">
    <div class="brand"><img src="../../../assets/logo.svg" alt=""><h1>ViuMic</h1></div>
    <p class="tagline">Removes the noise around you,<br><em>keeps your voice.</em></p>
    <div class="facts">
      <span>Free and open source</span>
      <span>Runs on any CPU</span>
      <span>Discord, Zoom, OBS</span>
      <span>Hidden from screen shares</span>
    </div>
  </div>
  <div class="spacie"><img src="../../spacie-mark.svg" alt="">A Spacie project</div>
  <div class="shot"><img src="../app.png" alt=""></div>
<script>
  // Noise (gray-blue squiggles, like the logo) runs in from the left; clean speech (mint)
  // comes out of the app on the right. Seeded, so every render is the same.
  let seed = 7
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  const svg = document.getElementById('waves')
  const NS = 'http://www.w3.org/2000/svg'
  const line = (pts, stroke, width, opacity) => {
    const p = document.createElementNS(NS, 'polyline')
    p.setAttribute('points', pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' '))
    p.setAttribute('fill', 'none')
    p.setAttribute('stroke', stroke)
    p.setAttribute('stroke-width', width)
    p.setAttribute('stroke-linejoin', 'round')
    p.setAttribute('opacity', opacity)
    svg.appendChild(p)
  }
  const Y = 500
  // Noise: jittery waves from the left edge, fading out under the text.
  for (let k = 0; k < 3; k++) {
    const pts = []
    for (let x = 0; x <= 846; x += 3) {
      const fade = Math.min(1, x / 200) * Math.max(0, 1 - Math.max(0, x - 640) / 206)
      const a = (10 + 8 * k) * fade
      const y = Y + Math.sin(x / (9 + k * 3) + k) * a * 0.6 + (rand() - 0.5) * a * 1.4
      pts.push([x, y])
    }
    line(pts, '#6a72a8', 2, 0.55 - k * 0.15)
  }
  // Clean speech: syllable-shaped bursts to the right of the app, on a quiet baseline.
  const bursts = [[1236, 14, 30], [1262, 10, 18]]
  const pts = []
  for (let x = 1218; x <= 1280; x += 1.5) {
    let env = 0
    for (const [c, w, h] of bursts) env += h * Math.exp(-(((x - c) / w) ** 2))
    pts.push([x, Y + Math.sin(x / 2.2) * env])
  }
  line(pts, '#4fe9c0', 2.2, 0.9)
</script>
</body>
</html>
