[package]
name = "viumic-app"
description = "ViuMic: AI noise removal for your microphone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "viumic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
viumic-engine.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Already in the tree via cpal; used to give the virtual cable ViuMic names.
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The COM `#[interface]` macro expands to `windows_core` paths.
windows-core = "0.100"

# Task Manager / Explorer show "ViuMic.exe" (the version info already says ViuMic).
[[bin]]
name = "ViuMic"
path = "src/main.rs"
